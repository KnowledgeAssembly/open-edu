<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Home — Variant A: Subtle Polish — OpenEdu</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;420;600;650;700&family=JetBrains+Mono:wght@400&family=Source+Serif+4:wght@400;600;700&display=swap" rel="stylesheet"/>
<script>
tailwind.config = {
  darkMode: "class",
  theme: {
    extend: {
      colors: {
        primary: "#5d4a8a",
        "primary-container": "#7c6bb0",
        "on-primary": "#ffffff",
        "on-primary-container": "#ede2ff",
        surface: "#fcfaf8",
        "surface-dim": "#e3dfda",
        "surface-bright": "#fefcf9",
        "surface-container": "#f2eee9",
        "surface-container-high": "#ebe7e2",
        "surface-container-low": "#f7f4f0",
        "surface-container-lowest": "#ffffff",
        "on-surface": "#1f1c18",
        "on-surface-variant": "#48443f",
        outline: "#76706b",
        "outline-variant": "#ccc6c0",
        accent: "#665e77",
        tertiary: "#b8862d",
        "tertiary-container": "#f0d68a",
        error: "#ba1a1a",
        success: "#16a34a",
        "primary-light": "#7c6bb0",
      },
      borderRadius: {
        sm: "0.125rem",
        DEFAULT: "0.375rem",
        md: "0.5rem",
        lg: "0.625rem",
        xl: "0.75rem",
        full: "9999px",
      },
      spacing: {
        xs: "4px",
        sm: "12px",
        md: "24px",
        lg: "40px",
        xl: "64px",
        gutter: "24px",
        "container-max": "720px",
      },
      fontFamily: {
        display: ["Inter", "system-ui", "sans-serif"],
        "body-ui": ["Inter", "system-ui", "sans-serif"],
        "body-reading": ['"Source Serif 4"', "Georgia", "serif"],
        mono: ['"JetBrains Mono"', "monospace"],
      },
      fontSize: {
        "display-lg": ["40px", { lineHeight: "1.1", letterSpacing: "-0.02em", fontWeight: "700" }],
        h1: ["28px", { lineHeight: "1.3", letterSpacing: "-0.01em", fontWeight: "650" }],
        h2: ["24px", { lineHeight: "1.3", fontWeight: "600" }],
        "body-ui": ["14px", { lineHeight: "1.6", fontWeight: "420" }],
        "body-reading": ["18px", { lineHeight: "1.7", fontWeight: "420", letterSpacing: "0.01em" }],
        caption: ["13px", { lineHeight: "1.5", fontWeight: "420" }],
        label: ["11px", { lineHeight: "1.0", letterSpacing: "0.08em", fontWeight: "600" }],
      },
    },
  },
};
</script>
<style>
  body { background: #fcfaf8; color: #1f1c18; }
  .no-scrollbar::-webkit-scrollbar { display: none; }
  .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

  @keyframes silhouette-breath {
    0%, 100% { opacity: 0.25; }
    50% { opacity: 0.30; }
  }
  @media (prefers-reduced-motion: reduce) {
    .silhouette-breath { animation: none !important; }
    .pipili-breathe { animation: none !important; }
  }

  @keyframes pipili-breathe {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.05); }
  }
  .pipili-breathe { animation: pipili-breathe 4s ease-in-out infinite; }
</style>
</head>
<body class="font-body-ui text-body-ui">
  <main class="mx-auto max-w-[720px] px-md py-lg flex flex-col gap-lg">
    <!-- Hero Section -->
    <section class="relative overflow-hidden rounded-xl px-10 py-12" style="background: linear-gradient(135deg, #f7f4f0 0%, #f2eee9 100%);">
      <!-- Assembly Flow background -->
      <svg viewBox="0 0 300 100" class="absolute inset-0 h-full w-full opacity-[0.08]" aria-hidden="true">
        <path d="M 15 55 C 20.83 48.33 36.67 31.67 50 35 C 63.33 38.33 73.33 53.33 90 65 C 106.67 76.67 116.67 55 130 30 C 143.33 5 150 45 170 60 C 190 75 196.67 55 210 40 C 223.33 25 236.67 55 250 65 C 263.33 75 276.67 55 285 45" fill="none" stroke="#5d4a8a" stroke-width="1.5" stroke-dasharray="8 5" opacity="0.15"/>
        <circle cx="15" cy="55" r="3" fill="#5d4a8a" opacity="0.12"/>
        <circle cx="50" cy="35" r="5" fill="#5d4a8a" opacity="0.25"/>
        <circle cx="90" cy="65" r="6" fill="#5d4a8a" opacity="0.5"/>
        <circle cx="130" cy="30" r="7" fill="#665e77" opacity="0.5"/>
        <circle cx="170" cy="60" r="6" fill="#5d4a8a" opacity="0.5"/>
        <circle cx="210" cy="40" r="5" fill="#665e77" opacity="0.5"/>
        <circle cx="250" cy="65" r="8" fill="#5d4a8a" opacity="0.6"/>
        <circle cx="285" cy="45" r="3" fill="#7c6bb0" opacity="0.12"/>
      </svg>

      <!-- Silhouette Assembly — subtle hero decoration (bottom-right) -->
      <div class="absolute bottom-4 right-6 flex items-end gap-3 opacity-[0.15]" aria-hidden="true">
        <div class="flex flex-col items-center">
          <div class="rounded-full" style="width:20px;height:20px;background:#5d4a8a;opacity:0.7;margin-bottom:-4px;"></div>
          <div class="rounded-[50%_50%_30%_30%]" style="width:26px;height:34px;background:#5d4a8a;opacity:0.25;"></div>
        </div>
        <div class="flex flex-col items-center">
          <div class="rounded-full" style="width:22px;height:22px;background:#665e77;opacity:0.7;margin-bottom:-4px;"></div>
          <div class="rounded-[50%_50%_30%_30%]" style="width:34px;height:32px;background:#665e77;opacity:0.25;"></div>
        </div>
        <div class="flex flex-col items-center">
          <div class="rounded-full" style="width:18px;height:18px;background:#7c6bb0;opacity:0.7;margin-bottom:-4px;"></div>
          <div class="rounded-[50%_50%_30%_30%]" style="width:24px;height:28px;background:#7c6bb0;opacity:0.25;"></div>
        </div>
      </div>

      <div class="relative z-10">
        <span class="font-label text-label uppercase tracking-wider text-primary mb-2 block">OpenEdu</span>
        <h1 class="font-display text-display-lg text-on-surface mb-sm">Welcome back, Learner</h1>
        <p class="font-body-reading text-body-reading text-on-surface-variant max-w-lg">Continue where you left off, or explore new courses in the catalog.</p>
      </div>
    </section>

    <!-- Stats row — with Open Module xs icons -->
    <div class="flex items-center gap-8">
      <div class="flex items-center gap-3">
        <svg width="48" height="48" viewBox="0 0 48 48" fill="none" aria-hidden="true">
          <circle cx="24" cy="24" r="18" stroke="#5d4a8a" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.18"/>
          <circle cx="30.2" cy="7.1" r="3" fill="#7c6bb0" opacity="0.7"/>
          <circle cx="30.2" cy="40.9" r="3" fill="#7c6bb0" opacity="0.7"/>
          <circle cx="24" cy="24" r="6" fill="#5d4a8a"/>
        </svg>
        <div>
          <span class="font-display text-h2 text-on-surface font-semibold leading-none">12</span>
          <span class="text-caption text-on-surface-variant block leading-tight">courses</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <svg width="48" height="48" viewBox="0 0 48 48" fill="none" aria-hidden="true">
          <circle cx="24" cy="24" r="18" stroke="#5d4a8a" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.18"/>
          <circle cx="30.2" cy="7.1" r="3" fill="#7c6bb0" opacity="0.7"/>
          <circle cx="30.2" cy="40.9" r="3" fill="#7c6bb0" opacity="0.7"/>
          <circle cx="24" cy="24" r="6" fill="#5d4a8a"/>
        </svg>
        <div>
          <span class="font-display text-h2 text-on-surface font-semibold leading-none">3</span>
          <span class="text-caption text-on-surface-variant block leading-tight">in progress</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <svg width="48" height="48" viewBox="0 0 48 48" fill="none" aria-hidden="true">
          <circle cx="24" cy="24" r="18" stroke="#5d4a8a" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.18"/>
          <circle cx="30.2" cy="7.1" r="3" fill="#7c6bb0" opacity="0.7"/>
          <circle cx="30.2" cy="40.9" r="3" fill="#7c6bb0" opacity="0.7"/>
          <circle cx="24" cy="24" r="6" fill="#5d4a8a"/>
        </svg>
        <div>
          <span class="font-display text-h2 text-on-surface font-semibold leading-none">5</span>
          <span class="text-caption text-on-surface-variant block leading-tight">badges</span>
        </div>
      </div>
    </div>

    <!-- Section Divider — Assembly Flow -->
    <div class="w-full overflow-hidden" role="separator" aria-hidden="true">
      <svg viewBox="0 0 300 100" class="h-8 w-full opacity-15" aria-hidden="true">
        <path d="M 30 55 C 70 48.33 110 36.67 150 40 C 190 43.33 210 53.33 270 50" fill="none" stroke="#5d4a8a" stroke-width="1.5" stroke-dasharray="8 5" opacity="0.15"/>
        <circle cx="30" cy="55" r="5" fill="#5d4a8a" opacity="0.25"/>
        <circle cx="150" cy="40" r="6" fill="#5d4a8a" opacity="0.5"/>
        <circle cx="270" cy="50" r="5" fill="#665e77" opacity="0.25"/>
      </svg>
    </div>

    <!-- CTA Card -->
    <div class="relative overflow-hidden rounded-xl border border-outline-variant bg-surface-container-lowest p-md">
      <div class="absolute right-0 top-0 opacity-[0.04]" aria-hidden="true">
        <svg width="120" height="120" viewBox="0 0 48 48" fill="none">
          <circle cx="24" cy="24" r="18" stroke="#5d4a8a" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.18"/>
          <circle cx="30.2" cy="7.1" r="3" fill="#7c6bb0" opacity="0.7"/>
          <circle cx="30.2" cy="40.9" r="3" fill="#7c6bb0" opacity="0.7"/>
          <circle cx="24" cy="24" r="6" fill="#5d4a8a"/>
        </svg>
      </div>
      <div class="relative z-10 flex flex-wrap gap-3">
        <button class="bg-primary text-on-primary font-semibold px-md py-sm rounded transition-opacity hover:opacity-90 text-sm">Browse Courses</button>
        <button class="bg-surface-container text-on-surface font-semibold px-md py-sm rounded transition-opacity hover:bg-surface-container-high text-sm">View Progress</button>
        <button class="bg-surface-container text-on-surface font-semibold px-md py-sm rounded transition-opacity hover:bg-surface-container-high text-sm">Settings</button>
      </div>
    </div>

    <!-- Pipili companion — fixed bottom-right -->
    <div class="fixed bottom-6 right-6 z-50 pipili-breathe" aria-label="Pipili — idle">
      <div class="relative flex items-center justify-center" style="width:48px;height:48px;">
        <svg width="48" height="48" viewBox="0 0 20 20" fill="#5d4a8a" aria-hidden="true">
          <circle cx="10" cy="10" r="8"/>
        </svg>
        <svg width="7.2" height="7.2" viewBox="0 0 20 20" fill="white" class="absolute" style="top:28%;left:38%;">
          <circle cx="10" cy="10" r="8"/>
        </svg>
        <svg width="7.2" height="7.2" viewBox="0 0 20 20" fill="white" class="absolute" style="top:28%;right:38%;">
          <circle cx="10" cy="10" r="8"/>
        </svg>
      </div>
    </div>
  </main>
</body>
</html>
